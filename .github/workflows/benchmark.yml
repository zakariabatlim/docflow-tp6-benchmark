name: Benchmark TP-6 sous Windows
on:
  workflow_dispatch:
    inputs:
      facturation_verifiee:
        description: "Quota et plafond de dépenses contrôlés par le titulaire du dépôt"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: docflow-tp6-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    if: ${{ inputs.facturation_verifiee && github.event.repository.private && github.event.repository.name == 'docflow-tp6-benchmark' && github.ref_name == github.event.repository.default_branch }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Lire uniquement le dépôt privé dédié
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Sélectionner Python 3.13 x64 dans le cache du runner
        run: |
          $cache = Join-Path $env:RUNNER_TOOL_CACHE 'Python'
          $python = Get-ChildItem -LiteralPath $cache -Directory -Filter '3.13.*' |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/python.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $python) { throw 'CPython 3.13 x64 absent du cache du runner.' }
          "TP6_PYTHON=$python" >> $env:GITHUB_ENV
      - name: Relever RAM et disque avant tout téléchargement
        run: |
          & $env:TP6_PYTHON -I -B scripts/preparer.py preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Récupérer les neuf fichiers épinglés et vérifier SHA-256
        run: |
          & $env:TP6_PYTHON -I -B scripts/preparer.py fetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Créer le venv et installer les seules roues vérifiées hors ligne
        run: |
          & $env:TP6_PYTHON -I -B scripts/preparer.py preflight --avant-installation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TP6_PYTHON -I -B -m venv .venv-tp6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv-tp6/Scripts/python.exe -I -B -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir --require-hashes --find-links wheels -r requirements-cpu.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv-tp6/Scripts/python.exe -I -B -m pip --isolated --disable-pip-version-check check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérifier puis comparer OpenCV et SLANet_plus CPU
        run: |
          ./.venv-tp6/Scripts/python.exe -I -B scripts/preparer.py installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv-tp6/Scripts/python.exe -I -B scripts/executer.py --deadline-seconds 660
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transformer les résultats et les arrêts en JSON et CSV
        if: always()
        run: |
          if ($env:TP6_PYTHON) {
            & $env:TP6_PYTHON -I -B scripts/exporter.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Déposer les seuls rapports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docflow-tp6-resultats
          path: |
            rapports/**/*.json
            rapports/**/*.csv
            rapports/**/*.log
          if-no-files-found: ignore
          retention-days: 7
